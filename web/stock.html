<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1621">
<title id="pgTitle">Stock — Stockbot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
{{BASE_CSS}}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);text-decoration:none;font-weight:500;font-size:.92rem}
.back:hover{color:var(--ink)}
.back svg{width:16px;height:16px}

/* hero: the ticker IS the headline */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 24px;align-items:end;margin-top:24px}
.hero .tick{font-size:clamp(2.6rem,7vw,4.2rem);line-height:.95;letter-spacing:-.01em}
.hero .name{font-size:1.02rem;color:var(--ink-2);margin-top:8px}
.hero .ctx{font-size:.86rem;color:var(--mute);margin-top:2px}
.hero .px{text-align:right}
.hero .px .last{font-family:"IBM Plex Sans Condensed","IBM Plex Sans",sans-serif;font-weight:600;font-size:clamp(1.9rem,5vw,2.7rem);line-height:1}
.hero .px .day{font-weight:500;margin-top:6px}
@media (max-width:620px){.hero{grid-template-columns:1fr}.hero .px{text-align:left}}

.stats{display:grid;grid-template-columns:minmax(0,2fr) repeat(2,minmax(0,1fr));gap:12px;margin-top:20px}
.stat{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--radius);padding:12px 14px}
.stat .k{font-size:.8rem;color:var(--mute)}
.stat .v{font-weight:600;margin-top:3px}
.range{position:relative;height:6px;border-radius:3px;background:var(--line);margin:10px 0 6px}
.range i{position:absolute;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--amber);border:2px solid var(--panel)}
.range-l{display:flex;justify-content:space-between;font-size:.8rem;color:var(--ink-2)}
@media (max-width:760px){.stats{grid-template-columns:1fr 1fr}.stats .stat:first-child{grid-column:1 / -1}}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;margin-top:20px;align-items:start}
.layout > .col{display:flex;flex-direction:column;gap:20px;min-width:0}
@media (max-width:1020px){.layout{grid-template-columns:minmax(0,1fr)}}

/* verdict */
.verdict-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.verdict-top .side{font-size:.95rem;padding:4px 10px}
.verdict-top .spacer{flex:1}
.verdict-sum{margin:12px 0 4px;color:var(--ink-2);max-width:62ch}
.setups{list-style:none;margin:14px 0 0;padding:0}
.setups li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:8px 0;border-top:1px solid var(--line-soft);font-size:.92rem}
.setups li .pts{color:var(--mute);font-size:.84rem}
.notes{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:.88rem;color:var(--ink-2)}
.notes li::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--mute);margin:0 9px 2px 2px}
.counter{font-size:.84rem;color:var(--mute);margin-top:12px}
.verdict-risk{margin-top:16px;padding-top:14px;border-top:1px solid var(--line-soft)}

/* key levels: a vertical price ladder, highest first */
.levels{list-style:none;margin:0;padding:0}
.levels li{display:grid;grid-template-columns:minmax(0,1fr) auto 104px;gap:12px;align-items:center;padding:9px 18px;border-top:1px solid var(--line-soft)}
.levels li .nm{font-size:.92rem}
.levels li .nm small{display:block;color:var(--mute);font-size:.78rem}
.levels li .val{font-weight:500;text-align:right}
.levels li .dist{font-size:.82rem;text-align:right;color:var(--mute);white-space:nowrap}
.levels li.here{background:var(--panel-2);box-shadow:inset 3px 0 0 var(--amber)}
.levels li.here .nm{font-weight:600}
.levels li.here .val{font-weight:600}

/* indicator tiles */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:0 18px 18px}
.tile{border:1px solid var(--line-soft);background:var(--panel-2);border-radius:var(--radius);padding:12px}
.tile .k{font-size:.8rem;color:var(--mute)}
.tile .v{font-size:1.25rem;font-weight:600;margin-top:2px}
.tile .t{font-size:.82rem;color:var(--ink-2);margin-top:4px}
.gauge{position:relative;height:6px;border-radius:3px;margin-top:10px;background:linear-gradient(90deg,var(--buy) 0 30%,var(--line) 30% 70%,var(--sell) 70% 100%);opacity:.9}
.gauge i{position:absolute;top:50%;width:4px;height:14px;margin:-7px 0 0 -2px;border-radius:2px;background:var(--ink)}
@media (max-width:420px){.tiles{grid-template-columns:1fr}}

.kv{list-style:none;margin:0;padding:0 18px 16px}
.kv li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line-soft);font-size:.92rem}
.kv li span:first-child{color:var(--ink-2)}
.analysts{display:flex;height:10px;border-radius:5px;overflow:hidden;margin-top:8px;background:var(--line)}
.analysts i{display:block;height:100%}
.legend{display:flex;gap:14px;font-size:.8rem;color:var(--ink-2);margin-top:6px;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;background:var(--c)}
.chart-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 18px 6px}
.chart-h .spacer{flex:1}
.chart-b{padding:0 10px 10px}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <a class="back" id="backLink" href="/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>Today</a>
    <span class="spacer"></span>
    <span class="mute small" id="asOf"></span>
    <button class="icon-btn" id="themeBtn" type="button" aria-label="Switch theme"></button>
  </div>
</header>

<main class="shell">
  <section class="hero">
    <div>
      <h1 class="tick" id="hSym">—</h1>
      <div class="name" id="hName">Loading…</div>
      <div class="ctx" id="hSub"></div>
    </div>
    <div class="px">
      <div class="last num" id="hPrice">—</div>
      <div class="day" id="hDay"></div>
    </div>
  </section>

  <section class="stats" id="stats" hidden>
    <div class="stat"><div class="k">52-week range</div><div class="range"><i id="rangeDot"></i></div><div class="range-l"><span id="rLo"></span><span id="rPos" class="mute"></span><span id="rHi"></span></div></div>
    <div class="stat"><div class="k">Market value</div><div class="v num" id="sCap">—</div></div>
    <div class="stat"><div class="k">Traded per day (20-day avg, IEX)</div><div class="v num" id="sVol">—</div></div>
  </section>

  <div class="layout">
    <div class="col">
      <section class="panel" aria-labelledby="vTitle">
        <div class="panel-h"><h2 id="vTitle">Scanner verdict</h2></div>
        <div class="panel-b" id="verdictCard"><div class="skeleton"></div></div>
      </section>

      <section class="panel">
        <div class="chart-h">
          <h2>Price chart</h2><span class="spacer"></span>
          <div class="seg" role="group" aria-label="Chart range">
            <button type="button" data-tf="1d" aria-pressed="false">1D</button>
            <button type="button" data-tf="1m" aria-pressed="false">1M</button>
            <button type="button" data-tf="6m" aria-pressed="false">6M</button>
            <button type="button" data-tf="1y" aria-pressed="true">1Y</button>
          </div>
        </div>
        <div class="chart-b"><div class="chart" id="chart"></div></div>
      </section>

      <section class="panel" aria-labelledby="indTitle">
        <div class="panel-h"><h2 id="indTitle">What the indicators say</h2></div>
        <div class="tiles" id="tiles"></div>
      </section>
    </div>

    <div class="col">
      <section class="panel" aria-labelledby="lvTitle">
        <div class="panel-h"><h2 id="lvTitle">Levels</h2><p class="mute small">Key prices from the daily chart, highest first. Not financial advice.</p></div>
        <ul class="levels" id="levelsTable"><li><div class="skeleton"></div></li></ul>
        <p class="note" id="lvNote" style="padding:0 18px 16px" hidden></p>
      </section>

      <section class="panel" aria-labelledby="fTitle">
        <div class="panel-h"><h2 id="fTitle">Company health</h2></div>
        <ul class="kv" id="fundTable"><li><div class="skeleton" style="width:100%"></div></li></ul>
        <p class="note" id="fundNotes" style="padding:0 18px 16px" hidden></p>
      </section>

      <section class="panel" aria-labelledby="sTitle">
        <div class="panel-h"><h2 id="sTitle">News and analysts</h2></div>
        <div class="panel-b" id="sentCard"><div class="skeleton"></div></div>
      </section>
    </div>
  </div>
</main>

<script>
{{COMMON_JS}}
const SYM = (QS.get('symbol') || '').toUpperCase();
$('backLink').href = homeUrl();
let CH = null, chartTf = '1y';
initTheme('themeBtn', () => { if (CH) CH.theme(); });

function fmtCap(musd) {
  if (musd == null) return '—';
  if (musd >= 1e6) return '$' + (musd / 1e6).toLocaleString('en-US', {maximumFractionDigits: 2}) + 'T';
  if (musd >= 1000) return '$' + (musd / 1000).toLocaleString('en-US', {maximumFractionDigits: 1}) + 'B';
  return '$' + musd.toLocaleString('en-US', {maximumFractionDigits: 0}) + 'M';
}
function fmtBig(v) {
  if (v == null) return '—';
  if (v >= 1e9) return '$' + (v / 1e9).toFixed(2) + 'B';
  if (v >= 1e6) return '$' + (v / 1e6).toFixed(1) + 'M';
  if (v >= 1e3) return '$' + (v / 1e3).toFixed(0) + 'K';
  return '$' + v.toFixed(0);
}
// plain meaning of %B and bandwidth (Breakout level / %B / Bandwidth wording kept stable)
function pctBText(v) {
  if (v == null) return '—';
  if (v >= 1) return 'above the upper band (breakout territory)';
  if (v <= 0) return 'below the lower band (capitulation/freefall)';
  if (v >= 0.45 && v <= 0.55) return 'on the 20-day average';
  if (v < 0.25) return 'hugging the lower band';
  if (v > 0.75) return 'pressing the upper band';
  return 'inside the bands';
}
function bwText(c) {
  if (!c) return '—';
  if (c === 'coiled') return 'coiled — at the tight end of its last 126 sessions, a big move often follows';
  if (c === 'wide') return 'wide — at the stretched end of its last 126 sessions';
  return 'normal — mid-range over its last 126 sessions';
}
function rsiText(v) {
  if (v == null) return '—';
  if (v < 30) return 'Oversold — sellers may be exhausted';
  if (v < 40) return 'Weak, close to oversold';
  if (v > 70) return 'Overbought — buyers may be stretched';
  if (v > 60) return 'Strong, close to overbought';
  return 'Neutral';
}

document.querySelectorAll('[data-tf]').forEach(b => b.onclick = () => {
  chartTf = b.dataset.tf;
  document.querySelectorAll('[data-tf]').forEach(x => x.setAttribute('aria-pressed', x.dataset.tf === chartTf));
  drawChart();
});
async function drawChart() {
  if (!SYM) return;
  try {
    const {bars} = await api('GET', '/api/candles?symbol=' + encodeURIComponent(SYM) + '&limit=200&tf=' + chartTf);
    if (!CH) CH = makeChart($('chart'));
    CH.series.setData(bars);
    if (chartTf === '1d') CH.chart.timeScale().scrollToRealTime(); else CH.chart.timeScale().fitContent();
  } catch (e) {}
}

function renderVerdict(v, price) {
  const box = $('verdictCard');
  if (!v) { box.innerHTML = '<p class="mute">Not enough daily history to run the technical screen on this stock yet.</p>'; return; }
  const score = v.side === 'BUY' ? v.tech_score : v.bear_score;
  const pb = v.side === 'BUY' && v.playbook ? (v.playbook === 'dip' ? 'a dip-buy' : 'a momentum') : (v.side === 'SELL' ? 'a sell-the-rally' : 'a');
  const reaches = v.push_bar != null && score >= v.push_bar;
  const summary = score > 0
    ? `Scores ${score} of 100 as ${pb} setup. ` + (reaches ? `That clears the ${v.push_bar} needed for a phone alert.` : `A phone alert needs ${v.push_bar}.`)
    : 'No setup is firing on this chart right now.';
  const setups = (v.setups || []).length
    ? '<ul class="setups">' + v.setups.map(s => `<li><span>${esc(s.reason)}</span><span class="pts num">+${s.points}</span></li>`).join('') + '</ul>' : '';
  const notes = (v.reasons || []).filter(r => !/^stop \$/.test(r));
  const notesHtml = notes.length ? '<ul class="notes">' + notes.map(r => `<li>${esc(r)}</li>`).join('') + '</ul>' : '';
  const counter = (v.counter_setups || []).length
    ? `<p class="counter">Pulling the other way: ${v.counter_setups.map(s => esc(s.reason)).join('; ')}.</p>` : '';
  const risk = score > 0 && v.stop != null ? `<div class="verdict-risk"><div class="mute small" style="margin-bottom:8px">If you take it: a stop at 2× the normal daily range, a target at 3×.</div>${ladder(price, v.stop, v.target)}</div>` : '';
  box.innerHTML = `<div class="verdict-top">${sideBadge(v.side, v.playbook)}<span class="spacer"></span>${meter(v.rating, v.side)}</div>
    <p class="verdict-sum">${summary}</p>${setups}${notesHtml}${counter}${risk}`;
}

function renderLevels(L, last) {
  const rows = (L.rows || []).filter(r => r.value != null).map(r => ({nm: r.name, basis: r.basis, v: r.value, d: r.distance_text}));
  rows.push({nm: 'Price now', basis: '', v: last, here: true});
  rows.sort((a, b) => b.v - a.v);
  $('levelsTable').innerHTML = rows.map(r => r.here
    ? `<li class="here"><span class="nm">Price now</span><span class="val num">${fmtP(r.v)}</span><span class="dist"></span></li>`
    : `<li><span class="nm">${esc(r.nm)}<small>${esc(r.basis || '')}</small></span><span class="val num">${fmtP(r.v)}</span><span class="dist">${esc(r.d || '')}</span></li>`).join('');
  if (L.buy_zone && L.buy_zone.note) {
    $('lvNote').hidden = false;
    $('lvNote').textContent = 'Breakout level: ' + L.buy_zone.note + (L.buy_zone.distance_text ? ` (the level sits ${L.buy_zone.distance_text} the current price)` : '');
  }
}

function renderTiles(L) {
  const t = [];
  const r = L.rsi14;
  t.push(`<div class="tile"><div class="k">Momentum (RSI 14)</div><div class="v num">${r == null ? '—' : r.toFixed(0)}</div>
    <div class="gauge" aria-hidden="true">${r == null ? '' : `<i style="left:${Math.max(0, Math.min(100, r))}%"></i>`}</div><div class="t">${rsiText(r)}</div></div>`);
  const vr = L.vol_ratio;
  t.push(`<div class="tile"><div class="k">Volume vs normal</div><div class="v num">${vr == null ? '—' : vr.toFixed(1) + '×'}</div>
    <div class="t">${vr == null ? '' : vr >= 2 ? 'Heavy — big players are active' : vr < 0.7 ? 'Light — little conviction' : 'About normal'}${L.vol_ratio_partial ? ' (partial day so far)' : ''}</div></div>`);
  t.push(`<div class="tile"><div class="k">Band position (%B)</div><div class="v num">${L.pct_b == null ? '—' : L.pct_b.toFixed(2)}</div><div class="t">${pctBText(L.pct_b)}</div></div>`);
  t.push(`<div class="tile"><div class="k">Band width (Bandwidth)</div><div class="v num">${L.bandwidth == null ? '—' : L.bandwidth.toFixed(3)}</div><div class="t">${bwText(L.bandwidth_context)}</div></div>`);
  $('tiles').innerHTML = t.join('');
}

function renderFund(f, last) {
  const ul = $('fundTable');
  if (!f || f.error) {
    const e = (f && f.error) || '';
    const msg = /FINNHUB_KEY/.test(e) ? 'Add a free Finnhub key (FINNHUB_KEY in .env) to see annual-report scores.'
      : /no annual/i.test(e) ? 'No annual report on file for this company (common for funds and recent listings).'
      : e || 'No annual report data yet.';
    ul.innerHTML = `<li><span class="mute">${esc(msg)}</span></li>`; return;
  }
  const p = f.piotroski, den = (p && p.evaluable != null && p.evaluable < p.of) ? p.evaluable : (p ? p.of : 9);
  const pcls = p && p.score != null ? (p.score >= 7 ? 'good' : p.score <= 3 ? 'bad' : 'warn') : '';
  const z = f.altman || {};
  const [zr, zc] = z.zone === 'safe' ? ['Low', 'good'] : z.zone === 'distress' ? ['High', 'bad'] : z.zone === 'grey' ? ['Moderate', 'warn'] : ['n/a', ''];
  const fv = f.dcf && f.dcf.fair_value, vs = fv != null && last ? (fv - last) / last * 100 : null;
  ul.innerHTML = `
    <li><span>Financial health <span class="mute small">Piotroski</span></span><span class="pill ${pcls}">${p && p.score != null ? p.score + '/' + den : 'n/a'}</span></li>
    <li><span>Bankruptcy risk <span class="mute small">Altman Z ${z.z != null ? z.z.toFixed(1) : ''}</span></span><span class="pill ${zc}">${zr}</span></li>
    <li><span>Fair value estimate <span class="mute small">cash-flow model</span></span><span>${fv != null ? fmtP(fv) : 'n/a'}${vs != null ? ` <span class="small ${vs >= 0 ? 'up' : 'down'}">${fmtPct(vs, 0)}</span>` : ''}</span></li>
    <li><span>Annual report</span><span>${esc(f.data_year || '—')}</span></li>`;
  if (f.notes && f.notes.length) { $('fundNotes').hidden = false; $('fundNotes').textContent = f.notes.join('. ') + '.'; }
}

function renderSent(s) {
  const ac = s.analyst_counts || {};
  const b = (ac.buy || 0) + (ac.strongBuy || 0), h = ac.hold || 0, se = (ac.sell || 0) + (ac.strongSell || 0), tot = b + h + se;
  const tone = s.label || 'neutral';
  const news = (s.n || 0) > 0 || (s.marketaux_n || 0) > 0
    ? `<p>Headlines read <b>${esc(tone)}</b> <span class="mute small">(${(s.n || 0) + (s.marketaux_n || 0)} recent articles, score ${s.news != null ? (s.news >= 0 ? '+' : '') + s.news.toFixed(2) : '—'})</span></p>`
    : '<p class="mute">No recent headlines found.</p>';
  const an = tot
    ? `<p style="margin-top:14px">${tot} analysts</p><div class="analysts" aria-hidden="true"><i style="width:${b / tot * 100}%;background:var(--buy)"></i><i style="width:${h / tot * 100}%;background:var(--mute)"></i><i style="width:${se / tot * 100}%;background:var(--sell)"></i></div>
       <div class="legend"><span style="--c:var(--buy)">${b} buy</span><span style="--c:var(--mute)">${h} hold</span><span style="--c:var(--sell)">${se} sell</span></div>`
    : '<p class="mute" style="margin-top:10px">No analyst ratings available.</p>';
  $('sentCard').innerHTML = news + an;
}

async function load() {
  document.title = SYM ? SYM + ' — Stockbot' : 'Stock — Stockbot';
  if (!SYM) { $('hName').textContent = 'No stock chosen. Go back and tap a symbol.'; return; }
  $('hSym').textContent = SYM;
  let d;
  try { d = await api('GET', '/api/stock/' + encodeURIComponent(SYM)); }
  catch (e) { $('hName').textContent = 'Could not load ' + SYM + ': ' + e.message; return; }
  const p = d.price, co = d.company || {}, st = d.stats || {};
  $('hName').textContent = co.name && co.name.toUpperCase() !== SYM ? co.name : '';
  $('hSub').textContent = [co.industry || co.sector, co.exchange].filter(Boolean).join(', ');
  $('hPrice').textContent = fmtP(p.last);
  const dp = p.day_pct;
  $('hDay').innerHTML = (dp == null ? '' : `<span class="${dp >= 0 ? 'up' : 'down'}">${fmtPct(dp, 2)} today</span>`) + (p.live ? '' : ' <span class="pill">Last close</span>');
  if (st.as_of) $('asOf').textContent = 'Daily data as of ' + new Date(st.as_of * 1000).toLocaleDateString('en-US', {timeZone: 'America/New_York', month: 'short', day: 'numeric'});
  if (st.low_52w != null && st.high_52w != null) {
    $('stats').hidden = false;
    const pos = st.pct_of_52w_range == null ? null : Math.max(0, Math.min(100, st.pct_of_52w_range));
    $('rangeDot').style.left = (pos == null ? 50 : pos) + '%';
    $('rLo').textContent = fmtP(st.low_52w); $('rHi').textContent = fmtP(st.high_52w);
    $('rPos').textContent = pos == null ? '' : pos.toFixed(0) + '% of the way up';
    $('sCap').textContent = fmtCap(co.market_cap_musd);
    $('sVol').textContent = fmtBig(st.avg_dollar_volume_20d);
  }
  renderVerdict(d.scanner, p.last);
  renderLevels(d.levels || {}, p.last);
  renderTiles(d.levels || {});
  renderFund(d.fundamentals, p.last);
  renderSent(d.sentiment || {});
  drawChart();
}
load();
</script>
</body>
</html>
